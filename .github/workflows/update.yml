name: Update DNS JSON

on:
  push:
    paths:
      - "dns.txt"
      - "scripts/update.js"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: write

# Same group as the sitemap workflow so they never push at the same time
concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run DNS generator
        run: node scripts/update.js

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain dns-list.json)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            git add dns-list.json
            git commit -m "Auto-update dns-list.json" || { echo "Nothing to commit"; exit 0; }

            if git push; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push rejected (attempt $i), syncing with remote and regenerating..."
            git fetch origin main
            git reset --hard origin/main
            node scripts/update.js
            sleep 3
          done

          echo "Failed to push after 5 attempts"
          exit 1
