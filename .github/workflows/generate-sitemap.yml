name: Generate Sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - "dns-list.json"
      - "sitemap.xml.gz"

# Same group as the DNS workflow so they never push at the same time
concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Install sitemap_generator
        run: gem install sitemap_generator

      - name: Generate sitemap
        # This step will create sitemap.xml.gz because compress is true in Rakefile
        run: ruby Rakefile

      - name: Commit sitemap
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sitemap.xml.gz
          git commit -m "Generate sitemap" || { echo "No changes, skipping commit"; exit 0; }

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
